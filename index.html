<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ MAHIR HOSTING - Premium Server</title>
    <style>
        :root {
            --bg: #06060d;
            --surface: #0d0d1a;
            --card: #111122;
            --border: #1e1e3a;
            --text: #e0e0f0;
            --text2: #9090b0;
            --accent: #7c3aed;
            --accent2: #a78bfa;
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
            --blue: #3b82f6;
            --radius: 14px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(124,58,237,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(59,130,246,0.05) 0%, transparent 50%);
        }

        /* Floating particles */
        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .particle {
            position: absolute; border-radius: 50%; background: var(--accent);
            animation: float linear infinite; opacity: 0;
        }
        @keyframes float {
            0% { transform: translateY(105vh) scale(0); opacity: 0; }
            15% { opacity: 0.7; }
            85% { opacity: 0.7; }
            100% { transform: translateY(-5vh) scale(1.5); opacity: 0; }
        }

        .app { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 15px; }

        /* Header */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 25px; background: var(--surface); border-radius: var(--radius);
            border: 1px solid var(--border); margin-bottom: 18px; flex-wrap: wrap; gap: 12px;
        }
        .logo { display: flex; align-items: center; gap: 14px; }
        .logo-icon {
            width: 50px; height: 50px; background: linear-gradient(135deg, var(--accent), #6366f1);
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; animation: glow 2s ease-in-out infinite;
        }
        @keyframes glow {
            0%,100% { box-shadow: 0 0 25px rgba(124,58,237,0.4); }
            50% { box-shadow: 0 0 55px rgba(124,58,237,0.8); }
        }
        .logo h1 {
            font-size: 1.6rem; font-weight: 800; letter-spacing: 1px;
            background: linear-gradient(135deg, #c4b5fd, #8b5cf6); -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; background-clip: text;
        }
        .logo span { font-size: 0.7rem; color: var(--text2); letter-spacing: 3px; display: block; }
        .stats { display: flex; gap: 15px; flex-wrap: wrap; }
        .stat {
            background: var(--card); padding: 8px 16px; border-radius: 20px;
            border: 1px solid var(--border); font-size: 0.85rem; display: flex; align-items: center; gap: 8px;
        }
        .dot { width: 9px; height: 9px; border-radius: 50%; }
        .dot.online { background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

        /* Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        @media(max-width:1100px) { .grid { grid-template-columns: 1fr 1fr; } }
        @media(max-width:700px) { .grid { grid-template-columns: 1fr; } }

        .panel {
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 20px; position: relative; overflow: hidden;
        }
        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.6;
        }
        .panel-title {
            font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px;
            color: var(--accent2); margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
        }
        .full-width { grid-column: 1 / -1; }

        /* Upload */
        .upload-zone {
            border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 25px;
            text-align: center; cursor: pointer; transition: 0.3s; background: var(--surface);
        }
        .upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: rgba(124,58,237,0.05); }
        .upload-zone .icon { font-size: 2.5rem; }
        #fileInput, #zipInput { display: none; }

        /* File list */
        .file-list { max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .file-list::-webkit-scrollbar { width: 3px; }
        .file-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        .file-item {
            display: flex; align-items: center; gap: 10px; padding: 11px 14px;
            background: var(--surface); border-radius: var(--radius-sm); border: 1px solid transparent;
            transition: 0.2s; cursor: pointer;
        }
        .file-item:hover { border-color: var(--accent); background: #1a1a30; transform: translateX(3px); }
        .file-item .name { flex: 1; font-size: 0.9rem; word-break: break-all; }
        .file-item .ext { color: var(--accent2); font-weight: 600; }

        /* Buttons */
        .btn {
            padding: 8px 16px; border: none; border-radius: 20px; cursor: pointer;
            font-size: 0.78rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
            transition: 0.25s; white-space: nowrap;
        }
        .btn-run { background: var(--green); color: #000; box-shadow: 0 0 15px rgba(16,185,129,0.3); }
        .btn-run:hover { box-shadow: 0 0 30px rgba(16,185,129,0.6); transform: scale(1.05); }
        .btn-del { background: transparent; color: var(--red); border: 1px solid rgba(239,68,68,0.5); }
        .btn-del:hover { background: rgba(239,68,68,0.15); }
        .btn-pri { background: var(--accent); color: #fff; }
        .btn-pri:hover { box-shadow: 0 0 25px rgba(124,58,237,0.5); }
        .btn-sm { padding: 5px 10px; font-size: 0.7rem; }

        /* PIP */
        .pip-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .pip-input {
            flex: 1; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border);
            border-radius: 20px; color: #fff; font-size: 0.85rem; outline: none;
        }
        .pip-input:focus { border-color: var(--accent); }
        .pip-tags { display: flex; flex-wrap: wrap; gap: 6px; max-height: 100px; overflow-y: auto; }
        .pip-tag {
            background: var(--surface); padding: 6px 12px; border-radius: 15px; font-size: 0.75rem;
            cursor: pointer; border: 1px solid var(--border); transition: 0.2s;
        }
        .pip-tag:hover { border-color: var(--accent); background: rgba(124,58,237,0.2); }

        /* Log */
        .log-box {
            background: #030308; border-radius: var(--radius-sm); padding: 14px;
            font-family: 'Courier New', monospace; font-size: 0.77rem; max-height: 350px;
            overflow-y: auto; border: 1px solid var(--border); line-height: 1.7;
        }
        .log-box::-webkit-scrollbar { width: 3px; }
        .log-box::-webkit-scrollbar-thumb { background: var(--border); }
        .log-line { padding: 2px 0; }
        .log-line.error { color: #f87171; }
        .log-line.success { color: #4ade80; }
        .log-line.warning { color: #fbbf24; }
        .log-line.info { color: #60a5fa; }
        .log-line.system { color: #c084fc; }

        /* Toast */
        .toast {
            position: fixed; top: 15px; right: 15px; z-index: 999;
            padding: 12px 20px; border-radius: 25px; font-weight: 600; font-size: 0.85rem;
            animation: slideIn 0.3s ease; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        .toast.ok { background: #065f46; color: #6ee7b7; border: 1px solid var(--green); }
        .toast.err { background: #7f1d1d; color: #fca5a5; border: 1px solid var(--red); }
        @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .empty { text-align: center; color: var(--text2); padding: 25px; }
    </style>
</head>
<body>
    <div id="particles"></div>

    <div class="app">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon">⚡</div>
                <div>
                    <h1>MAHIR HOSTING</h1>
                    <span>✦ PREMIUM SERVER ✦</span>
                </div>
            </div>
            <div class="stats">
                <div class="stat"><div class="dot online"></div> Online</div>
                <div class="stat">📁 <span id="fileCount">0</span> Files</div>
                <div class="stat">📦 <span id="extCount">0</span> Extracted</div>
            </div>
        </div>

        <div class="grid">
            <!-- Upload Panel -->
            <div class="panel">
                <div class="panel-title">📤 File Upload</div>
                <div class="upload-zone" id="uploadZone">
                    <div class="icon">⬆️</div>
                    <div>Click or Drag & Drop Files</div>
                    <div style="color:var(--text2);font-size:0.75rem;">.py .zip .txt .json .html .css .js .sh</div>
                </div>
                <input type="file" id="fileInput" multiple accept=".py,.zip,.txt,.json,.html,.css,.js,.sh,.yml,.yaml,.toml">
                <input type="file" id="zipInput" accept=".zip">
            </div>

            <!-- Files Panel -->
            <div class="panel">
                <div class="panel-title">📁 Your Files <button class="btn btn-sm btn-pri" style="margin-left:auto;" onclick="loadFiles()">🔄</button></div>
                <div class="file-list" id="fileList"><div class="empty">📭 No files</div></div>
            </div>

            <!-- PIP Panel -->
            <div class="panel">
                <div class="panel-title">📦 PIP Installer</div>
                <div class="pip-row">
                    <input class="pip-input" id="pipInput" placeholder="Package name..." onkeydown="if(event.key==='Enter')installPip()">
                    <button class="btn btn-pri" onclick="installPip()">Install</button>
                </div>
                <button class="btn btn-pri" style="width:100%;margin-bottom:10px;" onclick="installReq()">📋 Install requirements.txt</button>
                <div style="color:var(--text2);font-size:0.7rem;margin-bottom:6px;">Quick:</div>
                <div class="pip-tags" id="pipTags"></div>
            </div>

            <!-- Extracted Files -->
            <div class="panel">
                <div class="panel-title">📦 Extracted (ZIP)</div>
                <div class="file-list" id="extractedList"><div class="empty">📭 No extracted files</div></div>
            </div>

            <!-- Log Console (Full width) -->
            <div class="panel full-width">
                <div class="panel-title">
                    📜 Live Console
                    <button class="btn btn-sm btn-del" style="margin-left:auto;" onclick="clearLogDisplay()">Clear</button>
                </div>
                <div class="log-box" id="logBox">
                    <div class="log-line system">[MAHIR] ✨ Server ready...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="toasts"></div>

    <script>
        // Particles
        (function(){
            const c = document.getElementById('particles');
            for(let i=0; i<35; i++){
                const p = document.createElement('div');
                p.className='particle';
                p.style.left=Math.random()*100+'%';
                p.style.width=p.style.height=(Math.random()*3+1)+'px';
                p.style.animationDuration=(Math.random()*7+5)+'s';
                p.style.animationDelay=Math.random()*7+'s';
                c.appendChild(p);
            }
        })();

        const QUICK_PIPS = ['flask','django','requests','numpy','pandas','fastapi','uvicorn','discord.py','pillow','beautifulsoup4','selenium','aiogram','pyrogram','flask-cors','gunicorn'];

        // Init
        function init(){
            loadFiles();
            loadExtracted();
            loadLogs();
            renderPipTags();
            setInterval(loadLogs, 2000);
            setInterval(loadFiles, 8000);
            setInterval(loadExtracted, 8000);
        }

        // Toast
        function toast(msg, type='ok'){
            const t = document.createElement('div');
            t.className='toast '+type;
            t.textContent=msg;
            document.getElementById('toasts').appendChild(t);
            setTimeout(()=>{ t.style.opacity='0'; t.style.transition='0.4s'; }, 2500);
            setTimeout(()=>t.remove(), 3000);
        }

        // Upload
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        uploadZone.addEventListener('click', ()=>fileInput.click());
        uploadZone.addEventListener('dragover', e=>{ e.preventDefault();
            uploadZone.classList.add('drag'); });
        uploadZone.addEventListener('dragleave', ()=>uploadZone.classList.remove('drag'));
        uploadZone.addEventListener('drop', e=>{
            e.preventDefault();
            uploadZone.classList.remove('drag');
            uploadFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', ()=>{
            uploadFiles(fileInput.files);
            fileInput.value='';
        });

        async function uploadFiles(files){
            for(const f of files){
                const fd = new FormData();
                fd.append('file', f);
                try{
                    const r = await fetch('/api/upload', {method:'POST', body:fd});
                    const d = await r.json();
                    if(d.status==='ok'){
                        toast(f.name+' uploaded!', 'ok');
                    }else{
                        toast(d.message||'Upload failed', 'err');
                    }
                }catch(e){ toast('Error: '+e.message, 'err'); }
            }
            loadFiles();
            setTimeout(loadExtracted, 1500);
        }

        // Load files
        async function loadFiles(){
            try{
                const r = await fetch('/api/files');
                const d = await r.json();
                document.getElementById('fileCount').textContent = d.files.length;
                const list = document.getElementById('fileList');
                if(d.files.length===0){
                    list.innerHTML='<div class="empty">📭 No files</div>';
                    return;
                }
                list.innerHTML = d.files.map(f=>{
                    const ext = f.name.split('.').pop();
                    const icon = {py:'🐍',zip:'📦',txt:'📄',json:'📋',html:'🌐',css:'🎨',js:'📜',sh:'💻'}[ext]||'📎';
                    return `<div class="file-item">
                        <span>${icon}</span>
                        <span class="name">${f.name.replace('.'+ext,'')}<span class="ext">.${ext}</span></span>
                        <span style="font-size:0.7rem;color:var(--text2)">${formatSize(f.size)}</span>
                        <button class="btn btn-run btn-sm" onclick="event.stopPropagation();runFile('${f.name}')">▶ Run</button>
                        ${f.ext==='.zip' ? `<button class="btn btn-pri btn-sm" onclick="event.stopPropagation();unzip('${f.name}')">📦 Unzip</button>` : ''}
                        <button class="btn btn-del btn-sm" onclick="event.stopPropagation();delFile('${f.name}')">✕</button>
                    </div>`;
                }).join('');
                // Click to run
                document.querySelectorAll('#fileList .file-item').forEach(el=>{
                    el.addEventListener('click', function(){
                        const name = this.querySelector('.name').textContent.replace(/\.[^.]+$/,'') + this.querySelector('.ext').textContent;
                        runFile(name);
                    });
                });
            }catch(e){ console.error(e); }
        }

        // Run file
        async function runFile(filename){
            try{
                const r = await fetch('/api/run', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({filename})
                });
                const d = await r.json();
                toast(d.status==='ok' ? filename+' executed!' : 'Error: '+d.output.slice(0,60), d.status==='ok'?'ok':'err');
                loadLogs();
            }catch(e){ toast('Run error: '+e.message, 'err'); }
        }

        // Delete
        async function delFile(filename){
            if(!confirm('Delete '+filename+'?')) return;
            await fetch('/api/delete', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({filename})
            });
            loadFiles();
        }

        // Unzip
        async function unzip(filename){
            toast('Extracting...', 'ok');
            await fetch('/api/unzip', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({filename})
            });
            setTimeout(()=>{ loadExtracted();
                loadLogs(); }, 1500);
        }

        // Extracted files
        async function loadExtracted(){
            try{
                const r = await fetch('/api/extracted');
                const d = await r.json();
                document.getElementById('extCount').textContent = d.folders.length;
                const list = document.getElementById('extractedList');
                if(d.folders.length===0){
                    list.innerHTML='<div class="empty">📭 No extracted files</div>';
                    return;
                }
                let html = '';
                d.folders.forEach(folder=>{
                    html += `<div style="color:var(--accent2);font-weight:700;margin-top:8px;">📁 ${folder.name}</div>`;
                    folder.py_files.forEach(py=>{
                        html += `<div class="file-item" style="padding-left:25px;">
                            <span>🐍</span>
                            <span class="name">${py}</span>
                            <button class="btn btn-run btn-sm" onclick="event.stopPropagation();runExtracted('${py}')">▶ Run</button>
                        </div>`;
                    });
                });
                list.innerHTML = html;
            }catch(e){}
        }

        async function runExtracted(filepath){
            try{
                const r = await fetch('/api/run-extracted', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({filepath})
                });
                const d = await r.json();
                toast(d.status==='ok' ? 'Executed!' : 'Error', d.status==='ok'?'ok':'err');
                loadLogs();
            }catch(e){ toast('Error: '+e.message, 'err'); }
        }

        // PIP
        function renderPipTags(){
            document.getElementById('pipTags').innerHTML = QUICK_PIPS.map(p=>
                `<span class="pip-tag" onclick="quickInstall('${p}')">${p}</span>`
            ).join('');
        }

        async function installPip(){
            const inp = document.getElementById('pipInput');
            const pkg = inp.value.trim();
            if(!pkg) return toast('Enter package name', 'err');
            inp.value='';
            toast('Installing '+pkg+'...', 'ok');
            await fetch('/api/pip', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({package:pkg})
            });
            loadLogs();
        }

        function quickInstall(pkg){
            document.getElementById('pipInput').value = pkg;
            installPip();
        }

        async function installReq(){
            toast('Installing requirements.txt...', 'ok');
            await fetch('/api/requirements', {method:'POST'});
            loadLogs();
        }

        // Logs
        async function loadLogs(){
            try{
                const r = await fetch('/api/logs');
                const d = await r.json();
                const box = document.getElementById('logBox');
                box.innerHTML = d.logs.map(l=>
                    `<div class="log-line ${l.level}">[${l.time}] ${l.message}</div>`
                ).join('');
                box.scrollTop = box.scrollHeight;
            }catch(e){}
        }

        function clearLogDisplay(){
            document.getElementById('logBox').innerHTML = '<div class="log-line system">[MAHIR] Console cleared</div>';
        }

        function formatSize(b){
            if(b<1024) return b+' B';
            if(b<1048576) return (b/1024).toFixed(1)+' KB';
            return (b/1048576).toFixed(1)+' MB';
        }

        init();
    </script>
</body>
</html>
